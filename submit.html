<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>submit a clip · caseoh clips</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0e0e10;
            --surface: #18181b;
            --surface-hover: #202024;
            --border: #2a2a2e;
            --text: #efeff1;
            --muted: #adadb8;
            --purple: #9147ff;
            --purple-dark: #772ce8;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        header {
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;

            border-bottom: 1px solid var(--border);

            background: rgba(14, 14, 16, 0.92);

            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 20px;
            font-weight: 800;
        }

        .logo-box {
            width: 32px;
            height: 32px;

            display: grid;
            place-items: center;

            border-radius: 7px;

            background: var(--purple);

            font-weight: 800;
        }

        nav {
            display: flex;
            gap: 28px;

            color: var(--muted);

            font-size: 14px;
            font-weight: 600;
        }

        nav a:hover {
            color: white;
        }

        .page {
            width: min(680px, calc(100% - 40px));
            margin: 0 auto;

            padding: 80px 0;
        }

        .heading {
            margin-bottom: 34px;
        }

        .tag {
            display: inline-block;

            padding: 7px 10px;

            margin-bottom: 16px;

            border: 1px solid rgba(145, 71, 255, 0.35);
            border-radius: 6px;

            background: rgba(145, 71, 255, 0.1);

            color: #a970ff;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.08em;
        }

        h1 {
            margin-bottom: 12px;

            font-size: clamp(34px, 6vw, 52px);
            line-height: 1;

            letter-spacing: -0.04em;
        }

        .heading p {
            color: var(--muted);

            font-size: 15px;
            line-height: 1.7;
        }

        .form {
            padding: 28px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: var(--surface);

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 700;
        }

        .hint {
            display: block;

            margin-top: 6px;

            color: var(--muted);

            font-size: 11px;
            line-height: 1.5;
        }

        input,
        select {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid var(--border);
            border-radius: 7px;

            outline: none;

            background: #111114;
            color: white;

            font-size: 14px;
        }

        input:focus,
        select:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(145, 71, 255, 0.1);
        }

        button {
            width: 100%;

            padding: 13px 16px;

            border: none;
            border-radius: 7px;

            background: var(--purple);
            color: white;

            font-family: inherit;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        button:hover {
            background: var(--purple-dark);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .message {
            display: none;

            margin-top: 18px;
            padding: 12px 14px;

            border-radius: 7px;

            font-size: 13px;
            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .message.success {
            border: 1px solid rgba(5, 238, 147, 0.3);
            background: rgba(5, 238, 147, 0.08);
            color: #7ff2c4;
        }

        .message.error {
            border: 1px solid rgba(255, 80, 80, 0.3);
            background: rgba(255, 80, 80, 0.08);
            color: #ff9d9d;
        }

        footer {
            padding: 30px;

            border-top: 1px solid var(--border);

            color: var(--muted);

            text-align: center;

            font-size: 12px;
        }

        @media (max-width: 600px) {
            header {
                padding: 0 20px;
            }

            nav {
                display: none;
            }

            .page {
                width: min(100% - 28px, 680px);
                padding: 55px 0;
            }

            .form {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="/" class="logo">
            <div class="logo-box"><img src="https://caseoh.mcbcode.com/caseoh.jpg" style="width: 35px; border-radius: 5px;"></div>
            caseoh clips
        </a>

        <nav>
            <a href="https://caseoh.mcbcode.com/">home</a>
            <a href="https://caseoh.mcbcode.com/#clips">clips</a>
            <a href="https://caseoh.mcbcode.com/submit">submit</a>
        </nav>
    </header>

    <main class="page">

        <div class="heading">

            <h1>submit a clip.</h1>

            <p>
                found a caseoh moment that deserves to be archived?
                send it in, i'll take a look.
            </p>
        </div>

        <form class="form" id="submitForm">

            <div class="field">
                <label for="username">
                    twitch username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="your twitch username"
                    maxlength="25"
                    required
                >

                <span class="hint">
                    this must match the account that created the clip.
                </span>
            </div>

            <div class="field">
                <label for="clipUrl">
                    full clip url
                </label>

                <input
                    type="url"
                    id="clipUrl"
                    name="clipUrl"
                    placeholder="https://clips.twitch.tv/..."
                    required
                >
            </div>

            <div class="field">
                <label for="category">
                    category
                </label>

                <select id="category" name="category" required>
                    <option value="">select a category</option>
                    <option value="funny">funny</option>
                    <option value="rage">rage</option>
                    <option value="gaming">gaming</option>
                    <option value="chat">chat</option>
                    <option value="classic">classic</option>
                </select>
            </div>

            <button type="submit" id="submitButton">
                submit clip
            </button>

            <div class="message" id="message"></div>

        </form>

    </main>

    <footer>
        <strong>caseoh clips</strong> · a fan-made clip archive
    </footer>

    <script>
        const form = document.getElementById("submitForm");
        const button = document.getElementById("submitButton");
        const message = document.getElementById("message");

        form.addEventListener("submit", async event => {
            event.preventDefault();

            button.disabled = true;
            button.textContent = "submitting...";

            message.className = "message";
            message.textContent = "";

            const data = {
                twitchUsername:
                    document.getElementById("username").value.trim(),

                clipUrl:
                    document.getElementById("clipUrl").value.trim(),

                category:
                    document.getElementById("category").value
            };

            try {
                const response = await fetch(
                    "https://caseoh.mcbcode.workers.dev/submit",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(data)
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.error || "submission failed"
                    );
                }

                message.className = "message success";
                message.textContent =
                    "clip submitted successfully. thanks for contributing!";

                form.reset();

            } catch (error) {
                message.className = "message error";
                message.textContent =
                    error.message || "something went wrong";
            }

            button.disabled = false;
            button.textContent = "submit clip";
        });
    </script>
    
<script data-goatcounter="https://caseoh.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
