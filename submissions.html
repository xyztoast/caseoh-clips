<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>suggested clips · caseoh clips</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0e0e10;
            --surface: #18181b;
            --surface-hover: #202024;
            --border: #2a2a2e;
            --text: #efeff1;
            --muted: #adadb8;
            --purple: #9147ff;
            --purple-light: #a970ff;
            --purple-dark: #772ce8;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        body.popup-open {
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        header {
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;

            border-bottom: 1px solid var(--border);

            background: rgba(14, 14, 16, 0.92);
            backdrop-filter: blur(14px);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 20px;
            font-weight: 800;
        }

        .logo-box {
            width: 32px;
            height: 32px;

            display: grid;
            place-items: center;

            border-radius: 7px;

            background: var(--purple);
            color: white;

            font-size: 15px;
            font-weight: 800;
        }

        nav {
            display: flex;
            gap: 28px;

            color: var(--muted);

            font-size: 14px;
            font-weight: 600;
        }

        nav a {
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: white;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;

            padding: 70px 30px 90px;
        }

        .heading {
            margin-bottom: 35px;
        }

        .tag {
            display: inline-flex;

            padding: 7px 11px;
            margin-bottom: 16px;

            border: 1px solid rgba(145, 71, 255, 0.35);
            border-radius: 6px;

            background: rgba(145, 71, 255, 0.1);

            color: var(--purple-light);

            font-size: 11px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .heading h1 {
            margin-bottom: 12px;

            font-size: clamp(38px, 6vw, 58px);
            line-height: 1;

            letter-spacing: -0.045em;
        }

        .heading p {
            max-width: 650px;

            color: var(--muted);

            font-size: 15px;
            line-height: 1.7;
        }

        .submissions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .clip {
            overflow: hidden;

            border: 1px solid var(--border);
            border-radius: 9px;

            background: var(--surface);

            cursor: pointer;

            transition:
                transform 0.22s ease,
                border-color 0.22s ease,
                box-shadow 0.22s ease,
                background 0.22s ease;
        }

        .clip:hover {
            transform: translateY(-6px) scale(1.01);

            background: var(--surface-hover);

            border-color: rgba(145, 71, 255, 0.55);

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.4),
                0 0 25px rgba(145, 71, 255, 0.12);
        }

        .thumbnail {
            position: relative;

            aspect-ratio: 16 / 9;

            overflow: hidden;

            background: #111114;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            transition: transform 0.3s ease;
        }

        .clip:hover .thumbnail img {
            transform: scale(1.04);
        }

        .thumbnail::after {
            content: "▶";

            position: absolute;

            top: 50%;
            left: 50%;

            width: 48px;
            height: 48px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            background: rgba(145, 71, 255, 0.92);
            color: white;

            font-size: 16px;

            opacity: 0;

            transform: translate(-50%, -50%) scale(0.8);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .clip:hover .thumbnail::after {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .duration {
            position: absolute;

            right: 8px;
            bottom: 8px;

            z-index: 2;

            display: flex;
            align-items: center;
            gap: 6px;

            padding: 4px 7px;

            border-radius: 4px;

            background: rgba(0, 0, 0, 0.8);

            color: white;

            font-size: 11px;
            font-weight: 600;
        }

        .duration .views {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .duration .views img {
            width: 12px;
            height: 12px;

            display: block;

            opacity: 0.8;
        }

        .duration .separator {
            opacity: 0.55;
        }

        .clip-info {
            padding: 14px;
        }

        .clip-info h3 {
            margin-bottom: 10px;

            font-size: 14px;
            line-height: 1.45;
        }

        .clip-meta {
            color: var(--purple-light);

            font-size: 11px;
            font-weight: 600;
        }

        .empty {
            grid-column: 1 / -1;

            padding: 70px 20px;

            text-align: center;

            color: var(--muted);
        }

        /* popup */

        .clip-popup {
            position: fixed;

            inset: 0;

            z-index: 999;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 35px;

            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(12px);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.2s ease,
                visibility 0.2s ease;
        }

        .clip-popup.open {
            opacity: 1;
            visibility: visible;
        }

        .popup-content {
            width: min(1200px, 100%);

            position: relative;

            transform: scale(0.95) translateY(10px);

            transition: transform 0.2s ease;
        }

        .clip-popup.open .popup-content {
            transform: scale(1) translateY(0);
        }

        .popup-video {
            width: 100%;

            aspect-ratio: 16 / 9;

            display: block;

            border: none;
            border-radius: 10px;

            background: black;

            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.65),
                0 0 45px rgba(145, 71, 255, 0.12);
        }

        .popup-close {
            position: absolute;

            right: 0;
            top: -48px;

            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border: 1px solid var(--border);
            border-radius: 7px;

            background: rgba(24, 24, 27, 0.95);
            color: white;

            font-size: 20px;

            cursor: pointer;
        }

        .popup-close:hover {
            background: var(--purple);
        }

        footer {
            padding: 30px;

            border-top: 1px solid var(--border);

            color: var(--muted);

            text-align: center;

            font-size: 12px;
        }

        footer strong {
            color: var(--text);
        }

        @media (max-width: 900px) {
            header {
                padding: 0 20px;
            }

            nav {
                display: none;
            }

            .submissions {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .page {
                padding: 50px 18px 70px;
            }

            .submissions {
                grid-template-columns: 1fr;
            }

            .clip-popup {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="/" class="logo">
            <div class="logo-box">C</div>
            caseoh clips
        </a>

        <nav>
            <a href="/">home</a>
            <a href="/#clips">clips</a>
            <a href="/submit.html">submit</a>
        </nav>
    </header>

    <main class="page">

        <div class="heading">
            <div class="tag">community suggestions</div>

            <h1>suggested clips.</h1>

            <p>
                clips submitted by the community that are waiting to be
                added to the archive.
            </p>
        </div>

        <div class="submissions" id="submissionGrid">
            <div class="empty">
                loading submissions...
            </div>
        </div>

    </main>

    <footer>
        <strong>caseoh clips</strong> · a fan-made clip archive
    </footer>

    <div class="clip-popup" id="clipPopup">

        <div class="popup-content">

            <button class="popup-close" id="popupClose">
                ×
            </button>

            <iframe
                class="popup-video"
                id="popupVideo"
                src=""
                frameborder="0"
                allowfullscreen
                scrolling="no">
            </iframe>

        </div>

    </div>

    <script>
        const submissionGrid =
            document.getElementById("submissionGrid");

        const clipPopup =
            document.getElementById("clipPopup");

        const popupVideo =
            document.getElementById("popupVideo");

        const popupClose =
            document.getElementById("popupClose");

        let submissions = [];

        function formatViews(count) {
            if (count >= 1000000) {
                return `${(count / 1000000)
                    .toFixed(1)
                    .replace(/\.0$/, "")}m`;
            }

            if (count >= 1000) {
                return `${(count / 1000)
                    .toFixed(1)
                    .replace(/\.0$/, "")}k`;
            }

            return count.toString();
        }

        function createEmbedUrl(id) {
            const parent = window.location.hostname;

            return `https://clips.twitch.tv/embed?clip=${encodeURIComponent(id)}&parent=${encodeURIComponent(parent)}&autoplay=true`;
        }

        function openClip(clip) {
            popupVideo.src = createEmbedUrl(clip.clipId);

            clipPopup.classList.add("open");
            document.body.classList.add("popup-open");
        }

        function closeClip() {
            clipPopup.classList.remove("open");
            document.body.classList.remove("popup-open");

            popupVideo.src = "";
        }

        function escapeHtml(value) {
            const div = document.createElement("div");

            div.textContent = value ?? "";

            return div.innerHTML;
        }

        async function loadSubmissions() {
            try {
                const response = await fetch(
                    "https://caseoh.mcbcode.workers.dev/submissions"
                );

                if (!response.ok) {
                    throw new Error(
                        `worker returned ${response.status}`
                    );
                }

                const result = await response.json();

                submissions = result.data || [];

                renderSubmissions();

            } catch (error) {
                console.error(error);

                submissionGrid.innerHTML = `
                    <div class="empty">
                        couldn't load submissions
                    </div>
                `;
            }
        }

        function renderSubmissions() {
            if (submissions.length === 0) {
                submissionGrid.innerHTML = `
                    <div class="empty">
                        there aren't any pending suggestions right now.
                    </div>
                `;

                return;
            }

            submissionGrid.innerHTML = submissions.map(clip => `
                <div
                    class="clip"
                    data-clip-id="${escapeHtml(clip.clipId)}"
                >

                    <div class="thumbnail">

                        <img
                            src="${escapeHtml(clip.thumbnail)}"
                            alt="${escapeHtml(clip.title)}"
                            loading="lazy"
                        >

                        <span class="duration">

                            <span class="views">
                                <img src="/eye.png" alt="">
                                ${formatViews(clip.viewCount)}
                            </span>

                            <span class="separator">|</span>

                            <span>
                                ${escapeHtml(clip.duration)}
                            </span>

                        </span>

                    </div>

                    <div class="clip-info">

                        <h3>
                            ${escapeHtml(clip.title)}
                        </h3>

                        <div class="clip-meta">
                            ${escapeHtml(clip.category)}
                        </div>

                    </div>

                </div>
            `).join("");

            document.querySelectorAll(".clip").forEach(element => {
                element.addEventListener("click", () => {

                    const clip = submissions.find(
                        item =>
                            item.clipId ===
                            element.dataset.clipId
                    );

                    if (clip) {
                        openClip(clip);
                    }
                });
            });
        }

        popupClose.addEventListener("click", closeClip);

        clipPopup.addEventListener("click", event => {
            if (event.target === clipPopup) {
                closeClip();
            }
        });

        document.addEventListener("keydown", event => {
            if (
                event.key === "Escape" &&
                clipPopup.classList.contains("open")
            ) {
                closeClip();
            }
        });

        loadSubmissions();
    </script>

</body>
</html>
